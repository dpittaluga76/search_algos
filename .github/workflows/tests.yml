name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install development tools
        run: python -m pip install ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Type check the package for Linux and Windows
        run: |
          python -m mypy --platform linux --package search_algos
          python -m mypy --platform win32 --package search_algos
      - name: Verify installed typing marker
        run: python -c "from importlib.metadata import distribution; files = distribution('search-algos').files; assert files and any(str(path) == 'search_algos/py.typed' for path in files)"

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and development tools
        run: python -m pip install ".[dev]"
      - name: Run regression tests and doctests
        run: python -m coverage run -m unittest discover -s tests -v
      - name: Combine parent and worker coverage
        if: always()
        run: python -m coverage combine
      - name: Enforce 95 percent coverage including branches
        if: always()
        run: python -m coverage report
      - name: Export coverage report
        if: always()
        run: python -m coverage xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-python-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: warn
      - name: Build source distribution and verify its wheel outside the checkout
        run: python scripts/verify_release.py
